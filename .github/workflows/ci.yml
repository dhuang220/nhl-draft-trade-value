name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      # data/raw/ and data/processed/ are gitignored and are only populated by running
      # this project's fetch/train scripts, which pull multi-hundred-MB datasets from
      # Kaggle (kagglehub) and require Kaggle credentials. Regenerating them on every CI
      # run would make CI slow, flaky, and dependent on network/secrets that a portfolio
      # repo's checks shouldn't need just to prove the code is correct.
      #
      # tests/test_trade_grader.py builds a real TradeGrader(), which loads trained
      # models/CSVs from data/processed/ - those artifacts don't exist in a fresh
      # checkout, so that file is excluded here. Every other test file only exercises
      # pure functions against DataFrames constructed in the test itself, so it needs
      # no generated data and no network access.
      - run: python -m pytest --ignore=tests/test_trade_grader.py -v
